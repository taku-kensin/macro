<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マクロ">
<meta name="theme-color" content="#12151a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>マクロ</title>
<style>
:root{--bg:#12151a;--panel:#1a1f26;--panel2:#20262f;--line:#2c343f;--ink:#e7eaee;--mute:#8b95a3;--up:#5fbf8f;--dn:#e0727a;--accent:#d6b25e;
  --num:ui-monospace,"SF Mono","Menlo",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:rgba(18,21,26,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:50px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{color:var(--mute);font-size:11px}
.back{background:none;border:0;color:var(--accent);font-size:16px;padding:4px 6px 4px 0}
main{padding:12px 14px 40px}
.cat{margin:18px 0 6px;color:var(--accent);font-size:12px;letter-spacing:.14em}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0}
.item .t{font-size:15px}
.item .d{color:var(--mute);font-size:11px;margin-top:2px}
.item .v{text-align:right;font-family:var(--num);font-size:15px;white-space:nowrap}
.item .v small{display:block;font-size:11px}
.up{color:var(--up)} .dn{color:var(--dn)} .mute{color:var(--mute)}
.ranges{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.ranges button,.chip{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--mute);border-radius:16px;padding:6px 12px;font:inherit;font-size:13px}
.ranges button.on,.chip.on{background:var(--accent);border-color:var(--accent);color:#1a1409;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 10px 4px;margin:10px 0}
.chart .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.chart .hd .val{font-family:var(--num);font-size:17px}
.chart .hd .chg{font-family:var(--num);font-size:12px}
.chart .when{color:var(--mute);font-size:11px;font-family:var(--num);min-height:14px}
canvas{width:100%;height:170px;display:block;touch-action:pan-y}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--num)}
th{color:var(--mute);font-weight:500;font-family:inherit}
td:first-child,th:first-child{text-align:left;font-family:inherit}
.bar{height:8px;border-radius:4px;display:inline-block;vertical-align:middle}
.lock{max-width:360px;margin:60px auto;padding:0 20px;text-align:center}
.lock h2{font-size:22px;margin:0 0 6px}
.lock input[type=password]{width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);margin:16px 0 10px}
.lock button{width:100%;font-size:17px;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#1a1409;font-weight:600}
.lock label{display:block;color:var(--mute);font-size:13px;margin:6px 0 14px}
.err{color:var(--dn);font-size:13px;min-height:18px}
.note{color:var(--mute);font-size:12px;line-height:1.5}
.menu{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:4px 8px;font-size:12px}
.tabs{display:flex;gap:6px;margin:2px 0 8px}.tabs button{flex:1;padding:8px 0;border-radius:18px;background:var(--panel2);color:var(--mute);border:0;font:inherit;font-size:13px}
.tabs button.on{background:var(--accent);color:#1a1409;font-weight:600}
.lv{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;white-space:nowrap}
.l2{background:#1f4a36;color:#8fe0b6}.l1{background:#23402f;color:#9fd8b5}.l0{background:#2c343f;color:#b9c1cc}.l-1{background:#4a3a1a;color:#e8c77a}.l-2{background:#4a2226;color:#f0a0a6}.lx{background:#2a2d33;color:#7d8590}
.meter{display:flex;gap:4px;margin:12px 0 4px}.meter div{flex:1;height:12px;border-radius:4px;background:var(--line)}
.mlab{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.pbar{height:6px;background:var(--line);border-radius:3px;position:relative;margin:7px 0 3px}.pbar i{position:absolute;top:-3px;width:3px;height:12px;background:var(--accent);border-radius:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.more{display:none;border-top:1px solid var(--line);margin-top:9px;padding-top:9px;font-size:13px;color:#b9c1cc}
.card.open .more{display:block}
.rg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;text-align:center;margin-top:6px;font-size:12px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:7px 0;border-radius:8px}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.tot{font-family:var(--num);font-size:30px;letter-spacing:-.01em;margin:4px 0 2px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv b{font-weight:400;font-family:var(--num);text-align:right;white-space:nowrap}
.kv small{display:block;color:var(--mute);font-size:11px}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 6px}
.gh span:first-child{color:var(--accent);font-size:13px}
.gh span:last-child{font-family:var(--num);font-size:13px}
.hl{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0 0 6px;padding:10px 12px}
.hl .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hl .nm{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl .nm small{color:var(--mute);font-size:11px;margin-left:6px}
.hl .am{font-family:var(--num);font-size:14px;text-align:right;white-space:nowrap}
.hl .am small{display:block;font-size:11px}
.hl .more{display:none;border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.hl.open .more{display:block}
.due{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:#4a3a1a;color:#e8c77a;margin-left:6px}
</style>
</head>
<body>
<header id="hdr"><h1>マクロ</h1></header>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null, cur=null, range="1Y", sel={};
const RANGES=[["1M","1か月",30],["3M","3か月",91],["6M","6か月",182],["1Y","1年",365],["2Y","2年",730],["5Y","5年",1826],["ALL","全期間",1e6]];

function fmt(v){ if(v==null||isNaN(v))return "—"; const a=Math.abs(v);
  return v.toLocaleString("ja-JP",{maximumFractionDigits:a>=1000?0:a>=10?2:a>=1?3:4}); }
function ax(v){ const a=Math.abs(v);
  if(a>=1e8) return (v/1e8).toFixed(a>=1e9?0:1)+"億"; if(a>=1e5) return (v/1e4).toFixed(a>=1e6?0:1)+"万"; return fmt(v); }
function dlabel(d,period){ return period==="year"?d.slice(0,4)+"年":period==="month"?d.slice(0,4)+"年"+(+d.slice(5,7))+"月":d; }
function pct(a,b){ if(a==null||b==null||b===0)return null; return (a-b)/Math.abs(b)*100; }

// ---------- 復号 ----------
async function decrypt(buf,pw){
  const u=new Uint8Array(buf); const magic=new TextDecoder().decode(u.slice(0,6));
  if(magic!=="MACRO1") throw new Error("データの形式が違います");
  const salt=u.slice(6,22), iv=u.slice(22,34), ct=u.slice(34);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let plain; try{ plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct); }catch(e){ throw new Error("パスワードが違います"); }
  const ds=new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(ds).text());
}
async function load(pw){
  const r=await fetch("data.bin?t="+Date.now(),{cache:"no-store"}).catch(()=>fetch("data.bin"));
  if(!r.ok) throw new Error("データを読み込めませんでした（"+r.status+"）");
  return decrypt(await r.arrayBuffer(),pw);
}
function lockScreen(msg){
  $("#hdr").innerHTML='<h1>マクロ</h1>';
  $("#main").innerHTML=`<div class="lock"><h2>マクロ</h2><div class="note">パスワードを入れてください</div>
    <input type="password" id="pw" autocomplete="current-password" placeholder="パスワード">
    <label><input type="checkbox" id="keep" checked> このiPhoneに記憶する</label>
    <button id="go">開く</button><div class="err" id="err">${esc(msg||"")}</div></div>`;
  const go=async()=>{ const pw=$("#pw").value; $("#err").textContent="開いています…";
    try{ D=await load(pw); if($("#keep").checked) localStorage.setItem("macro_pw",pw); else localStorage.removeItem("macro_pw"); home(); }
    catch(e){ $("#err").textContent=e.message; } };
  $("#go").onclick=go; $("#pw").onkeydown=e=>{ if(e.key==="Enter") go(); };
}

// ---------- 一覧 ----------
function lastVal(it){
  if(it.kind!=="ts") return null;
  const s=it.series.find(s=>s.name===it.defaults[0])||it.series[0];
  for(let i=s.v.length-1;i>=0;i--) if(s.v[i]!=null){
    let j=i-1; while(j>=0&&s.v[j]==null) j--;
    return {name:s.name,v:s.v[i],d:dlabel(it.x[i],it.period),prev:j>=0?s.v[j]:null,flow:it.flow};
  }
  return null;
}
let TAB="flow";
let SEC=localStorage.getItem("app_sec")||"macro";
function seg(){ if(!D.asset) return ""; return `<div class="seg">${[["macro","マクロ"],["asset","資産"]].map(t=>`<button data-s="${t[0]}" class="${SEC===t[0]?"on":""}">${t[1]}</button>`).join("")}</div>`; }
function bindSeg(){ document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{SEC=b.dataset.s; localStorage.setItem("app_sec",SEC); home();}); }
function tabs(){ return `<div class="tabs">${[["flow","1か月の傾向"],["sector","業種の流れ"],["perf","条件の成績"],["list","指標一覧"]].filter(t=>t[0]==="list"||(t[0]==="sector"?D.sector:D.flow)).map(t=>`<button data-t="${t[0]}" class="${TAB===t[0]?"on":""}">${t[1]}</button>`).join("")}</div>`; }
function bindTabs(){ document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{TAB=b.dataset.t; home();}); }
const LVC=l=>"l"+l;
function condCard(r,opts={}){
  const tag=r.stale&&r.stale.length?`<span class="lv lx">データが古い</span>`:`<span class="lv ${LVC(r.level)}">${esc(r.label)}</span>`;
  const rg=Object.entries(r.regimes).map(([k,v])=>`<span class="mute">${esc(k)}</span>`).join("")+Object.entries(r.regimes).map(([k,v])=>`<span style="font-family:var(--num)">${v==null?"—":(v>0?"+":"")+v}</span>`).join("");
  return `<div class="card tap"><div class="row"><span>${esc(r.name)}</span>${tag}</div>
    ${opts.now?`<div class="note">${r.now.map(esc).join("／")}</div>`:""}
    <div class="row note"><span>前半 ${r.first>0?"+":""}${r.first}／後半 ${r.second>0?"+":""}${r.second}</span><span>上がった割合 ${r.up}%・${r.count}回</span></div>
    <div class="more">相場ごとの「ふだん」との差（1か月後、ポイント）<div class="rg">${rg}</div>
    ${r.stale&&r.stale.length?`<div style="margin-top:6px">使っている値が古いため、全体の判定から外しています：${r.stale.map(esc).join("、")}</div>`:""}</div></div>`;
}
function flowView(){
  const f=D.flow; const c=f.counts;
  let h=`<div class="card"><div class="row"><span class="note">${esc(f.week)}の値で判定${f.flow_week&&f.flow_week!==f.week?`（投資主体別は${esc(f.flow_week)}の週まで）`:""}</span><span class="note">成り立っている条件から</span></div>
    <div class="note" style="margin-top:4px">${esc(f.meaning||"過去に同じ条件だった週の、1か月後の日経平均の傾向")}</div>
    <div style="text-align:center;margin:8px 0 0"><span class="lv ${LVC(f.overall)}" style="font-size:22px;padding:4px 18px;border-radius:14px">${esc(f.overall_label)}</span></div>
    <div class="meter">${[-2,-1,0,1,2].map(l=>`<div style="${l===f.overall?"background:"+({"-2":"#e0727a","-1":"#d6b25e","0":"#8b95a3","1":"#5fbf8f","2":"#3fbf7f"})[l]:""}"></div>`).join("")}</div>
    <div class="mlab"><span>警戒</span><span>注意</span><span>中立</span><span>良好</span><span>好機</span></div>
    <div class="note" style="margin-top:8px">上がりやすい側 ${c.up}／下がりやすい側 ${c.down}${c.stale?`／データが古く除外 ${c.stale}`:""}</div></div>`;
  h+=`<div class="cat">成り立っている条件</div>`+(f.lit.length?f.lit.map(r=>condCard(r,{now:1})).join(""):`<div class="note">ありません</div>`);
  h+=`<div class="cat">もう少しで成り立つ条件</div>`+(f.near.length?f.near.map(r=>condCard(r,{now:1})).join(""):`<div class="note">ありません</div>`);
  h+=`<div class="cat">指標の位置（過去の中で 0〜100）</div><div class="card">`+f.positions.map(p=>`<div class="row" style="margin-top:6px"><span>${esc(p.name)}</span><span style="font-family:var(--num)">${fmt(p.value)}${esc(p.unit)}　${p.pct}</span></div>
    <div class="pbar"><i style="left:${p.pct}%"></i></div><div class="note" ${p.stale?'style="color:var(--dn)"':""}>${esc(p.span)}　${esc(p.date)}${p.stale?"（古い）":""}</div>`).join("")+`</div>`;
  if(f.reference&&f.reference.length){
    h+=`<div class="cat">参考（データが約2年のため、判定には使わない）</div>`+f.reference.map(r=>`<div class="card"><div class="row"><span>${esc(r.name)}</span>${r.lit?'<span class="lv l0">成立中</span>':""}</div>
      <div class="row note"><span>${esc(r.now)}</span><span>1か月後 ${r.avg==null?"—":(r.avg>0?"+":"")+r.avg+"%"}（ふだん ${r.base>0?"+":""}${r.base}%）・${r.count}回</span></div></div>`).join("");
  }
  h+=`<p class="note" style="margin-top:16px">決め方：${esc(f.rule)}　過去の結果であり、この先を約束するものではありません。</p>`;
  return h;
}
function sectorView(){
  const S=D.sector, st=S.stage, col={"0":"#d6b25e","1":"#e0727a","2":"#8bb7e0","3":"#5fbf8f","4":"#3fbf7f","9":"#8b95a3"};
  const f=v=>v==null?"—":(v>0?"+":"")+Number(v).toFixed(1)+"%", cl=v=>v>0?"up":v<0?"dn":"";
  let h=`<div class="card"><div class="row"><span class="note">${esc(S.prev_week)} → ${esc(S.week)} の週（対TOPIX）</span><span class="note">半導体の買い場の段階</span></div>
    <div style="text-align:center;margin:8px 0 0"><span class="lv" style="font-size:20px;padding:4px 16px;border-radius:14px;background:${col[st.id]};color:#111">${esc(st.label)}</span></div>
    <div class="meter">${[0,1,2,3,4].map(k=>`<div style="${k===st.id?"background:"+col[k]:""}"></div>`).join("")}</div>
    <div class="mlab"><span>崩れ始め</span><span>弱さ継続</span><span>先行転換</span><span>買い場</span><span>強さ継続</span></div>
    <div class="note" style="margin-top:8px">${esc(st.action)}</div>
    <div class="note" style="margin-top:4px">ディフェンシブ（食料品・電気ガス）で対TOPIXがプラス：${S.defense_plus}／2${S.defense_plus===2?"（半導体が下げている週の形）":S.defense_plus===0?"（ディフェンシブからお金が抜けている形）":""}</div></div>`;
  h+=`<div class="cat">注目の6系列</div><div class="card" style="overflow-x:auto"><table><tr><th style="text-align:left">系列</th><th>先週</th><th>今週</th><th>象限</th></tr>${S.focus.map(r=>`<tr><td>${esc(r.name)}</td><td class="${cl(r.prev)}">${f(r.prev)}</td><td class="${cl(r.now)}">${f(r.now)}</td><td style="font-size:11px">${esc(r.quad)}</td></tr>`).join("")}</table></div>`;
  const all=S.rows.filter(r=>r.prev!=null&&r.now!=null), mx=Math.max(4,...all.map(r=>Math.max(Math.abs(r.prev),Math.abs(r.now))))*1.1, W=340, sc=v=>W/2+v/mx*(W/2-14);
  h+=`<div class="cat">33業種＋2644の4象限（横＝先週・縦＝今週）</div><div class="card"><svg viewBox="0 0 ${W} ${W}" style="width:100%;height:auto">
    <line x1="${W/2}" y1="0" x2="${W/2}" y2="${W}" stroke="#555"/><line x1="0" y1="${W/2}" x2="${W}" y2="${W/2}" stroke="#555"/>
    <text x="4" y="12" font-size="9" fill="#999">左上 プラス転換</text><text x="${W-4}" y="12" font-size="9" fill="#999" text-anchor="end">右上 強さ継続</text>
    <text x="4" y="${W-4}" font-size="9" fill="#999">左下 弱さ継続</text><text x="${W-4}" y="${W-4}" font-size="9" fill="#999" text-anchor="end">右下 マイナス転換</text>
    ${all.map(r=>{const x=sc(r.prev),y=W-sc(r.now),c=r.now>0?(r.prev>0?"#3fbf7f":"#8bb7e0"):(r.prev>0?"#d6b25e":"#e0727a");return `<circle cx="${x}" cy="${y}" r="${r.focus?5:3}" fill="${c}"/>${r.focus?`<text x="${x+6}" y="${y+3}" font-size="10" fill="#ddd">${esc(r.name)}</text>`:""}`}).join("")}</svg>
    <div class="note">目盛り：中心から端まで ±${mx.toFixed(1)}%。名前つきは注目の6系列</div></div>`;
  h+=`<div class="cat">ディフェンシブの物差し（${esc(S.since)}以降）</div><div class="card" style="overflow-x:auto"><table><tr><th style="text-align:left">業種</th><th>今週</th><th>2644が下げた週に<br>プラス</th><th>下げなかった週に<br>プラス</th></tr>${S.defense.map(d=>`<tr><td>${esc(d.name)}</td><td class="${cl(d.now)}">${f(d.now)}</td><td>${d.down}%<div class="note">${esc(d.down_n)}</div></td><td>${d.up}%<div class="note">${esc(d.up_n)}</div></td></tr>`).join("")}</table></div>`;
  h+=`<div class="cat">段階ごとの、その後4週の2644（対TOPIX）</div><div class="card" style="overflow-x:auto"><table><tr><th style="text-align:left">段階</th><th>回数</th><th>平均</th><th>プラスの割合</th></tr>${S.stage_stats.map(s=>`<tr><td>${esc(s.label)}</td><td>${s.count}</td><td class="${cl(s.avg)}">${f(s.avg)}</td><td>${s.win==null?"—":s.win+"%"}</td></tr>`).join("")}</table><div class="note">全部の週の平均 ${f(S.stage_base)}。回数が少ないので参考</div></div>`;
  h+=`<div class="cat">直近8週の段階</div><div class="card">${S.history.slice().reverse().map(x=>`<div class="row"><span class="note">${esc(x.week)}</span><span>${esc(x.label)}</span></div>`).join("")}</div>`;

    let h=`<p class="note">${esc(it.date||"")}（前営業日 ${esc(it.prev_date||"")}）／TOPIX ${p(it.topix_ret)}%／推計との差 ${p(c.gap_pt)}pt</p>
      <div class="ranges">${K.map(k=>`<button data-k="${k}" class="${k===sp?"on":""}">${k}</button>`).join("")}</div>
      <table>${rs.map(r=>{const v=r[ix[sp]];return `<tr><td>${esc(r[0])}<div class="note">${r[1]}銘柄　当日 ${p(r[2])}%</div></td><td style="width:38%"><div style="position:relative;height:8px;background:var(--panel2);border-radius:3px"><i style="position:absolute;top:0;bottom:0;${v>=0?"left:50%":"right:50%"};width:${Math.abs(v)/mx*50}%;background:${v>=0?"var(--up,#3DBB7F)":"var(--dn,#F0626A)"}"></i></div></td><td class="${v>0?"up":v<0?"dn":""}">${p(v)}pt</td></tr>`}).join("")||'<tr><td class="note">この期間の記録がまだありません</td></tr>'}</table>
      <p class="note">TOPIX比（%ポイント）。${esc(it.method||"")}。加重：${esc(it.weight||"")}。記録 ${it.days}営業日。</p>`;
    $("#main").innerHTML=h;
    document.querySelectorAll(".ranges button").forEach(b=>b.onclick=()=>{window.S33=b.dataset.k; detail(it.id);});
    return;
  }
  if(it.kind==="weights"){
    const rows=it.rows||[], c=it.contrib||{}, yen=v=>v==null?"未取得":(v>0?"+":"")+fmt(Math.round(v))+"円", pct=v=>v==null?"—":(v>0?"+":"")+Number(v).toFixed(2)+"%";
    const cr=rows.filter(r=>r[7]!=null).sort((a,b)=>b[7]-a[7]);
    const li=r=>`<tr><td>${esc(r[2])}<div class="note">${esc(r[1])}　${pct(r[6])}</div></td><td class="${r[7]>0?"up":r[7]<0?"dn":""}">${yen(r[7])}</td></tr>`;
    let h=`<p class="note">市場日 ${esc(it.date||"")} ／ 公式基準 ${esc(it.base_date||"")}</p>`;
    if(cr.length){
      h+=`<div class="card"><div class="note">寄与度（${esc(c.from||"")} → ${esc(c.to||"")}）</div>
        <div class="kv"><span>日経平均の値動き</span><b class="${c.nikkei_change>0?"up":c.nikkei_change<0?"dn":""}">${yen(c.nikkei_change)}</b></div>
        <div class="kv"><span>225銘柄の寄与度の合計<small>実際との差 ${yen(c.gap)}（推計のずれ）</small></span><b>${yen(c.sum)}</b></div></div>
        <div class="gh"><span>押し上げ 上位10</span><span></span></div><table>${cr.slice(0,10).filter(r=>r[7]>0).map(li).join("")||'<tr><td class="note">ありません</td></tr>'}</table>
        <div class="gh"><span>押し下げ 上位10</span><span></span></div><table>${cr.slice(-10).reverse().filter(r=>r[7]<0).map(li).join("")||'<tr><td class="note">ありません</td></tr>'}</table>
        <div class="gh"><span>全銘柄</span><span></span></div>`;
    }
    h+=`<table><tr><th>順位</th><th>コード・銘柄</th><th>ウエート<div class="note">前日差</div></th><th>寄与度<div class="note">騰落率</div></th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}<div class="note">${esc(r[2])}${r[3]?" ／ "+esc(r[3]):""}</div></td><td>${Number(r[4]).toFixed(4)}%<div class="note ${r[5]>0?"up":r[5]<0?"dn":""}">${r[5]==null?"—":(r[5]>0?"+":"")+Number(r[5]).toFixed(4)+"pt"}</div></td><td class="${r[7]>0?"up":r[7]<0?"dn":""}">${r[7]==null?"—":yen(r[7])}<div class="note">${pct(r[6])}</div></td></tr>`).join("")}</table>
      <p class="note">${esc(it.method||"")}。公式の日次全225ウエートではなく推計値です。${cr.length?esc(c.method||"")+"。日経平均は"+esc(c.nikkei_source||"")+"。取引時間中に更新した日は、その時点の値です。":""}</p>`;
    $("#main").innerHTML=h; return;
  }
  if(it.kind==="snapshot"){
    $("#main").innerHTML=`<table><tr><th>銘柄</th><th>価格</th><th>取得時刻</th></tr>${it.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${fmt(r[1])}</td><td style="font-size:11px">${esc(r[2])}</td></tr>`).join("")}</table>
      <p class="note">macro_updaterが取った時刻の値です（その時刻より後の値動きは入っていません）。</p>`; return;
  }
  if(it.kind==="strike"){
    const mx=Math.max(1,...it.rows.flatMap(r=>[r[1]||0,r[2]||0]));
    $("#main").innerHTML=`<p class="note">${esc(it.date)}　限月 ${esc(it.month)}　建玉残高</p><table><tr><th>行使価格</th><th>プット</th><th>コール</th></tr>
      ${it.rows.filter(r=>(r[1]||0)+(r[2]||0)>0).map(r=>`<tr><td>${fmt(r[0])}</td>
      <td><span class="bar" style="width:${Math.round((r[1]||0)/mx*70)}px;background:var(--dn)"></span> ${fmt(r[1])}</td>
      <td><span class="bar" style="width:${Math.round((r[2]||0)/mx*70)}px;background:var(--up)"></span> ${fmt(r[2])}</td></tr>`).join("")}</table>`; return;
  }
  if(!sel[id]) sel[id]=[...it.defaults];
  $("#main").innerHTML=`<div class="ranges" id="rg">${RANGES.map(r=>`<button data-r="${r[0]}" class="${r[0]===range?"on":""}">${r[1]}</button>`).join("")}</div>
    <div class="chips" id="ch">${it.series.map(s=>`<button class="chip ${sel[id].includes(s.name)?"on":""}" data-n="${esc(s.name)}">${esc(s.name)}</button>`).join("")}</div>
    <div id="charts"></div>`;
  $("#rg").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; range=b.dataset.r; detail(id); };
  $("#ch").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; const n=b.dataset.n, a=sel[id];
    if(a.includes(n)){ if(a.length>1) a.splice(a.indexOf(n),1); } else a.push(n); detail(id); };
  drawAll(it);
  window.scrollTo(0,0);
}
function windowIdx(it){
  const days=RANGES.find(r=>r[0]===range)[2]; const last=it.x[it.x.length-1];
  const t0=new Date(last).getTime()-days*864e5; let i=0;
  while(i<it.x.length-1&&new Date(it.x[i]).getTime()<t0) i++;
  return i;
}
function drawAll(it){
  const i0=windowIdx(it); const box=$("#charts"); box.innerHTML="";
  const charts=[];
  for(const name of sel[it.id]){
    const s=it.series.find(s=>s.name===name); if(!s) continue;
    const pts=[]; for(let i=i0;i<it.x.length;i++) if(s.v[i]!=null) pts.push([it.x[i],s.v[i]]);
    const div=document.createElement("div"); div.className="chart";
    const last=pts.at(-1), first=pts[0];
    const ch=it.flow?pts.reduce((a,q)=>a+q[1],0):(last&&first?last[1]-first[1]:null), cp=(!it.flow&&last&&first)?pct(last[1],first[1]):null;
    div.innerHTML=`<div class="hd"><span>${esc(name)}</span><span class="val">${last?fmt(last[1]):"—"}</span></div>
      <div class="hd"><span class="when">${last?esc(last[0]):"この期間にデータがありません"}</span>
      <span class="chg ${ch>0?"up":ch<0?"dn":"mute"}">${ch==null?"":`${it.flow?"期間の合計":"期間の変化"} ${ch>0?"+":""}${fmt(ch)}${cp==null?"":`（${cp>0?"+":""}${cp.toFixed(1)}%）`}`}</span></div><canvas></canvas>`;
    box.appendChild(div);
    charts.push({div,pts,cv:div.querySelector("canvas"),name});
  }
  const paint=(hx)=>charts.forEach(c=>plot(c,hx,it.period,it.flow));
  paint(null);
  charts.forEach(c=>{
    const mv=e=>{ const r=c.cv.getBoundingClientRect(); const t=(e.touches?e.touches[0]:e); paint((t.clientX-r.left)/r.width); };
    c.cv.addEventListener("touchstart",mv,{passive:true}); c.cv.addEventListener("touchmove",mv,{passive:true});
    c.cv.addEventListener("mousemove",mv); c.cv.addEventListener("mouseleave",()=>paint(null));
    c.cv.addEventListener("touchend",()=>setTimeout(()=>paint(null),1500));
  });
}
function plot(c,hx,period,flow){
  const cv=c.cv, dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=170;
  cv.width=W*dpr; cv.height=H*dpr; const g=cv.getContext("2d"); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  const p=c.pts; if(p.length===0) return;
  const T=8,B=18,L=6; g.font="10px ui-monospace,Menlo,monospace"; const xs=p.map(q=>new Date(q[0]).getTime()), ys=p.map(q=>q[1]);
  let y0=Math.min(...ys), y1=Math.max(...ys); if(flow){ y0=Math.min(y0,0); y1=Math.max(y1,0); } if(y0===y1){y0-=1;y1+=1;} const pad=(y1-y0)*.06; y0-=pad; y1+=pad;
  const R=Math.max(...[y0,(y0+y1)/2,y1].map(v=>g.measureText(ax(v)).width))+10;
  const x0=xs[0], x1=xs.at(-1)===x0?x0+1:xs.at(-1);
  const X=t=>L+(W-L-R)*(t-x0)/(x1-x0), Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  g.font="10px ui-monospace,Menlo,monospace"; g.fillStyle="#8b95a3"; g.strokeStyle="#2c343f"; g.lineWidth=1;
  for(const k of [0,.5,1]){ const v=y0+(y1-y0)*k, y=Y(v); g.beginPath(); g.moveTo(L,y); g.lineTo(W-R,y); g.stroke(); g.fillText(ax(v),W-R+4,y+3); }
  if(y0<0&&y1>0){ g.strokeStyle="#465262"; g.beginPath(); g.moveTo(L,Y(0)); g.lineTo(W-R,Y(0)); g.stroke(); }
  g.fillText(p[0][0].slice(0,period==="year"?4:7),L,H-4); const lt=p.at(-1)[0].slice(0,period==="year"?4:7); g.fillText(lt,W-R-g.measureText(lt).width,H-4);
  const bars=flow&&p.length<=260;
  if(bars){ const bw=Math.max(1,(W-L-R)/p.length*.7);
    p.forEach((q,i)=>{ g.fillStyle=q[1]>=0?"#5fbf8f":"#e0727a"; const y=Y(q[1]), z=Y(Math.max(y0,Math.min(y1,0)));
      g.fillRect(X(xs[i])-bw/2,Math.min(y,z),bw,Math.max(1,Math.abs(z-y))); }); }
  else{ g.strokeStyle="#d6b25e"; g.lineWidth=1.6; g.beginPath(); p.forEach((q,i)=>{ const x=X(xs[i]), y=Y(q[1]); i?g.lineTo(x,y):g.moveTo(x,y); }); g.stroke(); }
  if(hx!=null){ const tx=x0+(x1-x0)*Math.max(0,Math.min(1,(hx*W-L)/(W-L-R)));
    let k=0,best=1e99; xs.forEach((t,i)=>{ const d=Math.abs(t-tx); if(d<best){best=d;k=i;} });
    const x=X(xs[k]), y=Y(p[k][1]); g.strokeStyle="#8b95a3"; g.lineWidth=1; g.beginPath(); g.moveTo(x,T); g.lineTo(x,H-B); g.stroke();
    g.fillStyle="#e7eaee"; g.beginPath(); g.arc(x,y,3.5,0,7); g.fill();
    c.div.querySelector(".val").textContent=fmt(p[k][1]); c.div.querySelector(".when").textContent=dlabel(p[k][0],period);
  } else { c.div.querySelector(".val").textContent=fmt(p.at(-1)[1]); c.div.querySelector(".when").textContent=dlabel(p.at(-1)[0],period); }
}
window.addEventListener("resize",()=>{ if(cur&&cur.kind==="ts") drawAll(cur); });

// ---------- 起動 ----------
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{ const pw=localStorage.getItem("macro_pw");
  if(pw){ $("#main").innerHTML='<div class="lock"><div class="note">開いています…</div></div>';
    try{ D=await load(pw); home(); return; }catch(e){ localStorage.removeItem("macro_pw"); lockScreen(e.message); return; } }
  lockScreen(); })();
</script>
