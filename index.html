<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マクロ">
<meta name="theme-color" content="#12151a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>マクロ</title>
<style>
:root{--bg:#12151a;--panel:#1a1f26;--panel2:#20262f;--line:#2c343f;--ink:#e7eaee;--mute:#8b95a3;--up:#5fbf8f;--dn:#e0727a;--accent:#d6b25e;
  --num:ui-monospace,"SF Mono","Menlo",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:rgba(18,21,26,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:50px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{color:var(--mute);font-size:11px}
.back{background:none;border:0;color:var(--accent);font-size:16px;padding:4px 6px 4px 0}
main{padding:12px 14px 40px;max-width:860px;margin:0 auto}
.cat{margin:18px 0 6px;color:var(--accent);font-size:12px;letter-spacing:.14em}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0}
.item .t{font-size:15px}
.item .d{color:var(--mute);font-size:11px;margin-top:2px}
.item .v{text-align:right;font-family:var(--num);font-size:15px;white-space:nowrap}
.item .v small{display:block;font-size:11px}
.up{color:var(--up)} .dn{color:var(--dn)} .mute{color:var(--mute)}
.ranges{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.ranges button,.chip{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--mute);border-radius:16px;padding:6px 12px;font:inherit;font-size:13px}
.ranges button.on,.chip.on{background:var(--accent);border-color:var(--accent);color:#1a1409;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 10px 4px;margin:10px 0}
.chart .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.chart .hd .val{font-family:var(--num);font-size:17px}
.chart .hd .chg{font-family:var(--num);font-size:12px}
.chart .when{color:var(--mute);font-size:11px;font-family:var(--num);min-height:14px}
canvas{width:100%;height:170px;display:block;touch-action:pan-y}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--num)}
th{color:var(--mute);font-weight:500;font-family:inherit}
td:first-child,th:first-child{text-align:left;font-family:inherit}
.bar{height:8px;border-radius:4px;display:inline-block;vertical-align:middle}
.lock{max-width:360px;margin:60px auto;padding:0 20px;text-align:center}
.lock h2{font-size:22px;margin:0 0 6px}
.lock input[type=password]{width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);margin:16px 0 10px}
.lock button{width:100%;font-size:17px;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#1a1409;font-weight:600}
.lock label{display:block;color:var(--mute);font-size:13px;margin:6px 0 14px}
.err{color:var(--dn);font-size:13px;min-height:18px}
.note{color:var(--mute);font-size:12px;line-height:1.5}
.menu{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:4px 8px;font-size:12px}
.tabs{display:flex;gap:6px;margin:2px 0 8px}.tabs button{flex:1;padding:8px 0;border-radius:18px;background:var(--panel2);color:var(--mute);border:0;font:inherit;font-size:13px}
.tabs button.on{background:var(--accent);color:#1a1409;font-weight:600}
.lv{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;white-space:nowrap}
.l2{background:#1f4a36;color:#8fe0b6}.l1{background:#23402f;color:#9fd8b5}.l0{background:#2c343f;color:#b9c1cc}.l-1{background:#4a3a1a;color:#e8c77a}.l-2{background:#4a2226;color:#f0a0a6}.lx{background:#2a2d33;color:#7d8590}
.meter{display:flex;gap:4px;margin:12px 0 4px}.meter div{flex:1;height:12px;border-radius:4px;background:var(--line)}
.mlab{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.pbar{height:6px;background:var(--line);border-radius:3px;position:relative;margin:7px 0 3px}.pbar i{position:absolute;top:-3px;width:3px;height:12px;background:var(--accent);border-radius:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.more{display:none;border-top:1px solid var(--line);margin-top:9px;padding-top:9px;font-size:13px;color:#b9c1cc}
.card.open .more{display:block}
.rg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;text-align:center;margin-top:6px;font-size:12px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:7px 0;border-radius:8px}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.tot{font-family:var(--num);font-size:30px;letter-spacing:-.01em;margin:4px 0 2px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv b{font-weight:400;font-family:var(--num);text-align:right;white-space:nowrap}
.kv small{display:block;color:var(--mute);font-size:11px}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 6px}
.gh span:first-child{color:var(--accent);font-size:13px}
.gh span:last-child{font-family:var(--num);font-size:13px}
.hl{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0 0 6px;padding:10px 12px}
.hl .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hl .nm{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl .nm small{color:var(--mute);font-size:11px;margin-left:6px}
.hl .am{font-family:var(--num);font-size:14px;text-align:right;white-space:nowrap}
.hl .am small{display:block;font-size:11px}
.hl .more{display:none;border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.hl.open .more{display:block}
.due{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:#4a3a1a;color:#e8c77a;margin-left:6px}
</style>
</head>
<body>
<header id="hdr"><h1>マクロ</h1></header>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null, cur=null, range="1Y", sel={};
// v1.7 指標の詳しい画面に重ねる日経225先物の線（最初は表示。チェックを外すと次からも消えたまま）
let FUT=localStorage.getItem("macro_fut")!=="0";
const FUTC="#6aa9e9";
function futSeries(){ if(!D) return null; if(D._fut!==undefined) return D._fut; let f=null;
  for(const c of D.cats) for(const it of c.items){
    if(it.kind!=="ts"||!String(it.id).startsWith("D_先物_日次|")||!/日経225/.test(it.title)) continue;
    const s=it.series.find(s=>s.name==="終値")||it.series[0]; if(!s) continue;
    const g={id:it.id,x:[],t:[],v:[]}; it.x.forEach((x,i)=>{ if(x&&s.v[i]!=null){ g.x.push(x); g.t.push(new Date(x).getTime()); g.v.push(s.v[i]); } });
    if(!f||g.v.length>f.v.length) f=g; }
  D._fut=f&&f.v.length>1?f:null; return D._fut; }
function futAt(F,t){ let lo=0,hi=F.t.length-1; if(t<=F.t[0]) return 0; if(t>=F.t[hi]) return hi;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(F.t[m]<=t) lo=m; else hi=m; } return (t-F.t[lo]<=F.t[hi]-t)?lo:hi; }
const RANGES=[["1M","1か月",30],["3M","3か月",91],["6M","6か月",182],["1Y","1年",365],["2Y","2年",730],["5Y","5年",1826],["ALL","全期間",1e6]];

function fmt(v){ if(v==null||isNaN(v))return "—"; const a=Math.abs(v);
  return v.toLocaleString("ja-JP",{maximumFractionDigits:a>=1000?0:a>=10?2:a>=1?3:4}); }
function ax(v){ const a=Math.abs(v);
  if(a>=1e8) return (v/1e8).toFixed(a>=1e9?0:1)+"億"; if(a>=1e5) return (v/1e4).toFixed(a>=1e6?0:1)+"万"; return fmt(v); }
function dlabel(d,period){ return period==="year"?d.slice(0,4)+"年":period==="month"?d.slice(0,4)+"年"+(+d.slice(5,7))+"月":d; }
function pct(a,b){ if(a==null||b==null||b===0)return null; return (a-b)/Math.abs(b)*100; }

// ---------- 復号 ----------
async function decrypt(buf,pw){
  const u=new Uint8Array(buf); const magic=new TextDecoder().decode(u.slice(0,6));
  if(magic!=="MACRO1") throw new Error("データの形式が違います");
  const salt=u.slice(6,22), iv=u.slice(22,34), ct=u.slice(34);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let plain; try{ plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct); }catch(e){ throw new Error("パスワードが違います"); }
  const ds=new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(ds).text());
}
async function load(pw){
  const r=await fetch("data.bin?t="+Date.now(),{cache:"no-store"}).catch(()=>fetch("data.bin"));
  if(!r.ok) throw new Error("データを読み込めませんでした（"+r.status+"）");
  return decrypt(await r.arrayBuffer(),pw);
}
function lockScreen(msg){
  $("#hdr").innerHTML='<h1>マクロ</h1>';
  $("#main").innerHTML=`<div class="lock"><h2>マクロ</h2><div class="note">パスワードを入れてください</div>
    <input type="password" id="pw" autocomplete="current-password" placeholder="パスワード">
    <label><input type="checkbox" id="keep" checked> このiPhoneに記憶する</label>
    <button id="go">開く</button><div class="err" id="err">${esc(msg||"")}</div></div>`;
  const go=async()=>{ const pw=$("#pw").value; $("#err").textContent="開いています…";
    try{ D=await load(pw); if($("#keep").checked) localStorage.setItem("macro_pw",pw); else localStorage.removeItem("macro_pw"); home(); }
    catch(e){ $("#err").textContent=e.message; } };
  $("#go").onclick=go; $("#pw").onkeydown=e=>{ if(e.key==="Enter") go(); };
}

// ---------- 一覧 ----------
function lastVal(it){
  if(it.kind!=="ts") return null;
  const s=it.series.find(s=>s.name===it.defaults[0])||it.series[0];
  for(let i=s.v.length-1;i>=0;i--) if(s.v[i]!=null){
    let j=i-1; while(j>=0&&s.v[j]==null) j--;
    return {name:s.name,v:s.v[i],d:dlabel(it.x[i],it.period),prev:j>=0?s.v[j]:null,flow:it.flow};
  }
  return null;
}
let TAB=null;
let SEC=localStorage.getItem("app_sec")||"macro";
function seg(){ if(!D.asset) return ""; return `<div class="seg">${[["macro","マクロ"],["asset","資産"]].map(t=>`<button data-s="${t[0]}" class="${SEC===t[0]?"on":""}">${t[1]}</button>`).join("")}</div>`; }
function bindSeg(){ document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{SEC=b.dataset.s; localStorage.setItem("app_sec",SEC); home();}); }
function hasMap(){ return !!(D.level&&D.level.map&&D.level.map.rows&&D.level.map.rows.length); }
// v1.13 2026/11/23 書き方の見直し：頭は3枚のカード（相場全体・半導体と受け皿・値段の節目）。
// 出すのは「今の数字」「過去の例（回数と一番悪い例つき）」「言えない事」だけ。買う・売る・待つは出さない。
// 前の「買いやすさ1〜5」「今週どうする」「1か月の傾向（好機〜警戒）」「条件の成績」は外した（記録：マクロアプリの表現の見直し_20261123.md）
const pct1=v=>v==null?"—":(v>0?"+":"")+Number(v).toFixed(1)+"%";
const mdy=s=>{ if(!s) return "—"; const p=String(s).split(/[\/-]/); return p.length>=3?(+p[1])+"/"+(+p[2]):String(s); };
const ymdj=s=>{ if(!s) return "—"; const p=String(s).split(/[\/-]/); return p.length>=3?p[0]+"/"+(+p[1])+"/"+(+p[2]):String(s); };
const yen0=v=>v==null?"—":Math.round(v).toLocaleString();
const ud=v=>v>0?"up":v<0?"dn":"";
function go(t){ TAB=t; home(); }
function bindNav(){ document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go)); }
const linkRow=(t,label)=>`<button data-go="${t}" style="display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--accent);font:inherit;font-size:13px;padding:12px 0 2px;margin-top:8px">${label} ›</button>`;
const fact=(k,v)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px"><span class="mute" style="white-space:nowrap">${k}</span><span style="text-align:right">${v}</span></div>`;

// 下げの深さの物差し：左端が0%、右へ行くほど深い。点＝過去の大きな下げの底、線＝今
function ruler(sc){
  const R=sc.ruler; if(!R||!R.n) return "";
  const LO=Math.min(-35,Math.floor((Math.min(...R.past,R.now)-2)/5)*5), X=v=>4+(Math.min(0,v)/LO)*92;
  const placed=[]; let dots="";
  [...R.past].sort((a,b)=>b-a).forEach(v=>{ const x=X(v); let r=0; while(placed.some(q=>Math.abs(q[0]-x)<2.8&&q[1]===r)) r++; placed.push([x,r]);
    dots+=`<i style="position:absolute;left:calc(${x.toFixed(2)}% - 4px);top:${36-r*10}px;width:9px;height:9px;border-radius:50%;box-sizing:border-box;border:2px solid var(--mute);background:var(--panel)"></i>`; });
  const xn=X(R.now), ticks=[]; for(let v=0;v>=LO;v-=10) ticks.push(v);
  return `<div style="position:relative;height:70px;margin:8px 0 2px">
    <div style="position:absolute;left:4%;right:4%;top:40px;height:2px;background:var(--line)"></div>${dots}
    <div style="position:absolute;left:calc(${xn.toFixed(2)}% - 1px);top:4px;width:2px;height:46px;background:var(--accent)"></div>
    <span style="position:absolute;${xn>70?`right:calc(${(100-xn).toFixed(2)}% + 6px)`:`left:calc(${xn.toFixed(2)}% + 6px)`};top:0;font-size:11px;line-height:14px;color:var(--accent);font-weight:700;white-space:nowrap">今 ${pct1(R.now)}</span>
    ${ticks.map(v=>`<span style="position:absolute;left:calc(${X(v).toFixed(2)}% - 16px);top:52px;width:32px;text-align:center;font-size:11px;color:var(--mute);font-family:var(--num)">${v}%</span>`).join("")}</div>`;
}

// 1枚目：相場全体（今の数字だけ。名前は状態を言う言葉）
function sceneCard(){
  const L=D.level; if(!L) return "";
  const sc=L.scene, fa=L.facts||{};
  if(!sc) return `<div class="card"><div class="row"><b>相場全体</b><span class="note">${esc(L.date||"")}の終値まで</span></div>
    <div class="note" style="margin-top:6px">データが前の形のままです。PCで更新をもう一度動かすと、新しい形で出ます。</div></div>`;
  const ds=sc.decl_sum, from=ds&&ds.from?ds.from.replace("/","年")+"月":"";
  const lowTxt=`${esc(mdy(sc.low_date))}の${yen0(sc.low)}円`+(sc.low_days===0?"（今の所の一番安い終値）":`（${sc.low_days}営業日、割っていない）`);
  return `<div class="card"><div class="row"><b>相場全体</b><span class="note">${esc(mdy(L.date))}の終値 ${yen0(L.close)}円</span></div>
    <div style="display:flex;align-items:center;gap:12px;margin:8px 0 0"><div style="font-size:34px;line-height:1.25;font-family:var(--num);white-space:nowrap" class="${ud(sc.dd)}">${pct1(sc.dd)}</div>
      <div><div style="font-size:13px">高値からの下げ</div><div class="note">${esc(mdy(sc.high_date))}の${yen0(sc.high)}円から${sc.high_days}営業日</div></div></div>
    <div style="font-size:13px;margin-top:4px">今の場面：${esc(sc.name)}</div>
    ${ruler(sc)}
    <div class="note">点＝大きな下げ${sc.ruler?sc.ruler.n:0}回の底${from?"（"+esc(from)+"から）":""}${sc.in_decline&&sc.ruler?`。今より深かったのは${sc.ruler.deeper}回、浅かったのは${sc.ruler.shallower}回`:""}</div>
    <div style="margin-top:8px">
      ${fact("安値",lowTxt)}
      ${fact("信用で買った人の含み損",fa.pl==null?"—":`<span style="font-family:var(--num)">${pct1(fa.pl)}</span>（${esc(fa.pl_date||"—")}の週）`)}
      ${fact("日経VI",fa.vi==null?"—":`<span style="font-family:var(--num)">${fa.vi}</span>${fa.vi_rank==null?"":`（3年の中で高い方から${100-fa.vi_rank}%）`}`)}
      ${fact("200日線から",`<span style="font-family:var(--num)">${pct1(fa.dev200)}</span>`)}
    </div>${linkRow("past","過去の例を見る")}</div>`;
}

// 2枚目：半導体と受け皿（そのものの値動き。対TOPIXは押した先に）
function semisCard(){
  const S=D.sector; if(!S) return "";
  if(!S.moves) return `<div class="card"><div class="row"><b>半導体と受け皿</b><span class="note">${esc(S.week||"")}の週</span></div><div style="font-size:13px;margin-top:6px">今週の形：${esc(S.stage?S.stage.label:"—")}</div>${linkRow("sector","業種を見る")}</div>`;
  const g=c=>S.moves.find(m=>m.code===c)||{}, t=g("TOPIX"), s=g("2644"), u=S.uke||{};
  const mx=Math.max(4,...[t.w_abs,s.w_abs,u.w_abs].map(v=>Math.abs(v||0)));
  const bar=(nm,v)=>`<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><div style="width:100px;font-size:12px;white-space:nowrap">${nm}</div>
    <div style="flex:1;display:flex;align-items:center"><div style="flex:1;display:flex;justify-content:flex-end">${v<0?`<div style="height:12px;width:${(Math.abs(v)/mx*100).toFixed(1)}%;background:var(--dn);border-radius:3px 0 0 3px"></div>`:""}</div><div style="width:1px;height:18px;background:var(--mute)"></div><div style="flex:1">${v>0?`<div style="height:12px;width:${(v/mx*100).toFixed(1)}%;background:var(--up);border-radius:0 3px 3px 0"></div>`:""}</div></div>
    <div style="width:60px;text-align:right;font-family:var(--num);font-size:14px;white-space:nowrap" class="${ud(v)}">${pct1(v)}</div></div>`;
  const cell=(k,v)=>`<div><div class="note" style="font-size:11px">${k}</div><div style="font-family:var(--num);font-size:14px" class="${ud(v)}">${pct1(v)}</div></div>`;
  return `<div class="card"><div class="row"><b>半導体と受け皿</b><span class="note">今週 ${esc(mdy(S.week_from))}→${esc(mdy(S.last_day))}${S.partial?"（途中）":""}</span></div>
    <div class="note" style="margin-top:6px">そのものの値動き</div>
    ${bar("TOPIX",t.w_abs)}${bar("半導体（2644）",s.w_abs)}${bar("受け皿",u.w_abs)}
    <div class="note" style="margin-top:8px">今四半期（${esc(mdy(S.q_from))}→${esc(mdy(S.last_day))}）</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:2px 0 8px">${cell("TOPIX",t.q_abs)}${cell("半導体",s.q_abs)}${cell("受け皿",u.q_abs)}</div>

      ${sc.confirm.map(x=>`<tr><td>安値を${x.days}日割らない</td><td>${x.pct}%<div class="note">${x.n}回のうち${x.broke}回</div></td><td>${pct1(x.above)}</td></tr>`).join("")}</table></div>

function listView(){
  let h="";
  const P=D.pos;
  if(P&&P.items&&P.items.length){
    h+=`<div class="cat">指標の位置（過去の中で 0〜100）</div><div class="card">`+P.items.map(p=>`<div class="row" style="margin-top:6px"><span>${esc(p.name)}</span><span style="font-family:var(--num)">${fmt(p.value)}${esc(p.unit)}　${p.pct}</span></div>
      <div class="pbar"><i style="left:${p.pct}%"></i></div><div class="note" ${p.stale?'style="color:var(--dn)"':""}>${esc(p.span)}　${esc(p.date)}${p.stale?"（古い）":""}</div>`).join("")+`<div class="note" style="margin-top:8px">位置は、その指標が、下に書いた期間の中で、低い方から何%の所にいるか。良し悪しは言いません</div></div>`;

        right=`<div class="v ${lv.flow?(lv.v>0?"up":lv.v<0?"dn":""):""}">${fmt(lv.v)}<small class="${ch>0?"up":ch<0?"dn":"mute"}">${lv.flow?"":ch==null?"":"前回比 "+(ch>0?"+":"")+fmt(ch)}</small></div>`; }

      else if(it.kind==="strike") right=`<div class="v mute" style="font-size:12px">${esc(it.date)}</div>`;
      else if(it.kind==="styles"){ const g=(it.data.spreads||[])[0]; right=`<div class="v mute" style="font-size:12px">${g?esc(g.name)+"<div>5日 "+(g.d5>0?"+":"")+Number(g.d5).toFixed(2)+"%</div>":""}</div>`; }
      else if(it.kind==="baskets"){ const r=[...it.data.baskets].sort((a,b)=>b.d1-a.d1); right=`<div class="v mute" style="font-size:12px">強い ${esc(r[0].name)}<div>弱い ${esc(r[r.length-1].name)}</div></div>`; }
      else if(it.kind==="sectors"){ const t=it.rows[0]; right=`<div class="v mute" style="font-size:12px">33業種　${esc(it.date||"")}<div>首位 ${esc(t?t[0]:"")}</div></div>`; }

    }

  h+=`<p class="note" style="margin-top:20px">元データ：${esc(D.source)}（④-1）。値は④-1のまま表示しています。</p>`;

// v1.11 2026/11/10 価格帯ごとの売買の量：その値段でどれだけ売買されたか（過去1年・直近60日）と建玉を横棒にする（v1.13：見込みの言葉をやめ、売買が多い・少ないだけを言う）
function profileCard(col){
  const F=D.level.profile, f=v=>Math.round(v).toLocaleString();
  const bgOf=z=>z.cls==="thin"?"rgba(214,178,94,.22)":z.cls==="thick"?(z.now?"rgba(139,149,163,.22)":z.lo>F.price?"rgba(224,114,122,.18)":"rgba(95,191,143,.18)"):"transparent";
  const fgOf=z=>z.cls==="thin"?"#d6b25e":z.cls==="thick"?(z.now?"#c9d1d9":z.lo>F.price?col.res:col.sup):"var(--mute)";
  const isNow=r=>r.b<=F.price&&F.price<r.b+F.step;
  const labelRow={};
  F.zones.forEach((z,zi)=>{ const rs=F.rows.filter(r=>z.lo<=r.b&&r.b<z.hi&&!isNow(r)); if(rs.length) labelRow[rs[Math.floor((rs.length-1)/2)].b]=zi; });
  let h=`<div class="card"><div class="row"><span class="note">${esc(F.date)}の終値 ${f(F.price)}円</span><span class="note">棒＝その値段での売買の量</span></div>
    <div class="note" style="margin:6px 0 2px"><span style="color:rgba(106,169,233,.7)">■</span> 過去${F.n}日の売買代金　<span style="color:#6aa9e9">■</span> うち直近${F.n60}日　<span style="color:${col.sup}">■</span> プットの建玉　<span style="color:${col.res}">■</span> コールの建玉</div>
    <div class="note" style="margin:0 0 8px"><span style="background:rgba(214,178,94,.35);padding:0 6px;border-radius:3px;white-space:nowrap">売買が少ない</span>　<span style="background:rgba(95,191,143,.3);padding:0 6px;border-radius:3px;white-space:nowrap">多い（下）</span>　<span style="background:rgba(224,114,122,.3);padding:0 6px;border-radius:3px;white-space:nowrap">多い（上）</span></div>
    <div class="note" style="display:flex;gap:6px;margin-bottom:2px"><div style="width:50px;text-align:right">値段</div><div style="flex:1.5">売買の量</div><div style="flex:.8">建玉</div><div style="width:78px;text-align:center">売買の量</div></div>`;
  for(const r of F.rows){
    const z=F.zones.find(z=>z.lo<=r.b&&r.b<z.hi)||{cls:"mid"}, now=isNow(r);
    const lab=now?`いま ${f(F.price)}`:(labelRow[r.b]!=null?F.zones[labelRow[r.b]].label:"");
    h+=`<div style="display:flex;align-items:center;gap:6px;background:${bgOf(z)};padding:2px 0;${now?"box-shadow:inset 0 2px 0 var(--accent);":""}">
      <div style="width:50px;text-align:right;font-family:var(--num);font-size:11px;color:var(--mute)">${r.b%1000===0?f(r.b):""}</div>
      <div style="flex:1.5;position:relative;height:13px"><div style="position:absolute;left:0;top:0;height:13px;width:${Math.min(100,r.v/F.maxv_view*100)}%;background:rgba(106,169,233,.38);border-radius:2px"></div><div style="position:absolute;left:0;top:3px;height:7px;width:${Math.min(100,r.v60/F.maxv_view*100)}%;background:#6aa9e9;border-radius:1px"></div></div>
      <div style="flex:.8;height:11px"><div style="height:11px;width:${F.maxoi?Math.min(100,r.oi/F.maxoi*100):0}%;background:${r.side==="put"?col.sup:col.res};border-radius:2px"></div></div>
      <div style="width:78px;text-align:center;font-size:12px;font-weight:700;white-space:nowrap;color:${now?"var(--accent)":fgOf(z)}">${esc(lab)}</div></div>`;
  }
  h+=`<div class="note" style="margin-top:8px">値段の数字は、その行の帯の下の端（60,000 の行は 60,000〜${f(60000+F.step)}円）</div>
    ${F.says.map(x=>`<div style="margin-top:6px;font-size:13px">・${esc(x)}</div>`).join("")}
    <div class="note" style="margin-top:8px">${esc(F.rule)}</div></div>`;
  return h;
}
function levelsCard(M,col){

function windowIdx(it){
  const days=RANGES.find(r=>r[0]===range)[2]; const last=it.x[it.x.length-1];
  const t0=new Date(last).getTime()-days*864e5; let i=0;

function drawAll(it){
  const i0=windowIdx(it); const box=$("#charts"); box.innerHTML="";
  const fs=futSeries(), F=(FUT&&fs&&fs.id!==it.id)?fs:null;
  const charts=[];

    const s=it.series.find(s=>s.name===name); if(!s) continue;

    const div=document.createElement("div"); div.className="chart";
    const last=pts.at(-1), first=pts[0];
    const ch=it.flow?pts.reduce((a,q)=>a+q[1],0):(last&&first?last[1]-first[1]:null), cp=(!it.flow&&last&&first)?pct(last[1],first[1]):null;
    div.innerHTML=`<div class="hd"><span>${esc(name)}</span><span class="val">${last?fmt(last[1]):"—"}</span></div>
      <div class="hd"><span class="when">${last?esc(last[0]):"この期間にデータがありません"}</span>
      <span class="chg ${ch>0?"up":ch<0?"dn":"mute"}">${ch==null?"":`${it.flow?"期間の合計":"期間の変化"} ${ch>0?"+":""}${fmt(ch)}${cp==null?"":`（${cp>0?"+":""}${cp.toFixed(1)}%）`}`}</span></div>${F?`<div class="fl" style="color:${FUTC};font-size:11px;font-family:var(--num);min-height:14px"></div>`:""}<canvas></canvas>`;
    box.appendChild(div);
    charts.push({div,pts,cv:div.querySelector("canvas"),name});
  }
  const paint=(hx)=>charts.forEach(c=>plot(c,hx,it.period,it.flow,F));
  paint(null);
  charts.forEach(c=>{
    const mv=e=>{ const r=c.cv.getBoundingClientRect(); const t=(e.touches?e.touches[0]:e); paint((t.clientX-r.left)/r.width); };
    c.cv.addEventListener("touchstart",mv,{passive:true}); c.cv.addEventListener("touchmove",mv,{passive:true});
    c.cv.addEventListener("mousemove",mv); c.cv.addEventListener("mouseleave",()=>paint(null));
    c.cv.addEventListener("touchend",()=>setTimeout(()=>paint(null),1500));

function plot(c,hx,period,flow,F){
  const cv=c.cv, dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=170;
  cv.width=W*dpr; cv.height=H*dpr; const g=cv.getContext("2d"); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  const p=c.pts; if(p.length===0) return;
  const T=8,B=18,L=6; g.font="10px ui-monospace,Menlo,monospace"; const xs=p.map(q=>new Date(q[0]).getTime()), ys=p.map(q=>q[1]);
  let y0=Math.min(...ys), y1=Math.max(...ys); if(flow){ y0=Math.min(y0,0); y1=Math.max(y1,0); } if(y0===y1){y0-=1;y1+=1;} const pad=(y1-y0)*.06; y0-=pad; y1+=pad;
  const R=Math.max(...[y0,(y0+y1)/2,y1].map(v=>g.measureText(ax(v)).width))+10;
  const x0=xs[0], x1=xs.at(-1)===x0?x0+1:xs.at(-1);
  const X=t=>L+(W-L-R)*(t-x0)/(x1-x0), Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  g.font="10px ui-monospace,Menlo,monospace"; g.fillStyle="#8b95a3"; g.strokeStyle="#2c343f"; g.lineWidth=1;
  for(const k of [0,.5,1]){ const v=y0+(y1-y0)*k, y=Y(v); g.beginPath(); g.moveTo(L,y); g.lineTo(W-R,y); g.stroke(); g.fillText(ax(v),W-R+4,y+3); }
  if(y0<0&&y1>0){ g.strokeStyle="#465262"; g.beginPath(); g.moveTo(L,Y(0)); g.lineTo(W-R,Y(0)); g.stroke(); }
  g.fillText(p[0][0].slice(0,period==="year"?4:7),L,H-4); const lt=p.at(-1)[0].slice(0,period==="year"?4:7); g.fillText(lt,W-R-g.measureText(lt).width,H-4);
  const bars=flow&&p.length<=260;
  if(bars){ const bw=Math.max(1,(W-L-R)/p.length*.7);
    p.forEach((q,i)=>{ g.fillStyle=q[1]>=0?"#5fbf8f":"#e0727a"; const y=Y(q[1]), z=Y(Math.max(y0,Math.min(y1,0)));
      g.fillRect(X(xs[i])-bw/2,Math.min(y,z),bw,Math.max(1,Math.abs(z-y))); }); }
  let fi=null;
  if(F){ const a=F.t.findIndex(t=>t>=x0); let b=-1; for(let i=F.t.length-1;i>=0;i--) if(F.t[i]<=x1){ b=i; break; }
    if(a>=0&&b>a){ let f0=Infinity,f1=-Infinity; for(let i=a;i<=b;i++){ if(F.v[i]<f0) f0=F.v[i]; if(F.v[i]>f1) f1=F.v[i]; }
      if(f0===f1){ f0-=1; f1+=1; } const fp=(f1-f0)*.06; f0-=fp; f1+=fp; const FY=v=>T+(H-T-B)*(1-(v-f0)/(f1-f0));
      g.save(); g.strokeStyle=FUTC; g.globalAlpha=.85; g.lineWidth=1.2; g.beginPath();
      for(let i=a;i<=b;i++){ const x=X(F.t[i]), y=FY(F.v[i]); i>a?g.lineTo(x,y):g.moveTo(x,y); } g.stroke(); g.restore(); fi=[a,b]; } }
  if(!bars){ g.strokeStyle="#d6b25e"; g.lineWidth=1.6; g.beginPath(); p.forEach((q,i)=>{ const x=X(xs[i]), y=Y(q[1]); i?g.lineTo(x,y):g.moveTo(x,y); }); g.stroke(); }
  const fl=c.div.querySelector(".fl");
  if(fl){ if(!fi) fl.textContent="日経225先物：この期間のデータがありません"; else {
    const k=hx!=null?Math.max(fi[0],Math.min(fi[1],futAt(F,xs[(()=>{ const tx=x0+(x1-x0)*Math.max(0,Math.min(1,(hx*W-L)/(W-L-R))); let kk=0,bb=1e99; xs.forEach((t,i)=>{ const d=Math.abs(t-tx); if(d<bb){bb=d;kk=i;} }); return kk; })()]))):fi[1];
    fl.textContent=`日経225先物 ${fmt(F.v[k])}（${F.x[k]}）`; } }
  if(hx!=null){ const tx=x0+(x1-x0)*Math.max(0,Math.min(1,(hx*W-L)/(W-L-R)));
    let k=0,best=1e99; xs.forEach((t,i)=>{ const d=Math.abs(t-tx); if(d<best){best=d;k=i;} });
    const x=X(xs[k]), y=Y(p[k][1]); g.strokeStyle="#8b95a3"; g.lineWidth=1; g.beginPath(); g.moveTo(x,T); g.lineTo(x,H-B); g.stroke();
    g.fillStyle="#e7eaee"; g.beginPath(); g.arc(x,y,3.5,0,7); g.fill();
    c.div.querySelector(".val").textContent=fmt(p[k][1]); c.div.querySelector(".when").textContent=dlabel(p[k][0],period);
  } else { c.div.querySelector(".val").textContent=fmt(p.at(-1)[1]); c.div.querySelector(".when").textContent=dlabel(p.at(-1)[0],period); }
}
